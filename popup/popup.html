<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../src/ui/common.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <div>
      <div class="title" data-i18n="extName"></div>
      <div class="muted small" id="portal"></div>
    </div>
  </header>
  <section class="status">
    <span class="dot" id="dot"></span>
    <span id="state"></span>
  </section>
  <section class="info" id="info" hidden>
    <div class="muted small" id="user"></div>
    <div class="unread"><span data-i18n="popupUnread"></span>: <b id="unread">0</b></div>
    <div class="muted small" id="muted" hidden></div>
  </section>
  <section class="actions">
    <button class="primary" id="open" data-i18n="popupOpen"></button>
    <button class="primary" id="login" data-i18n="popupLogin" hidden></button>
    <button class="primary" id="setup" data-i18n="popupSetup" hidden></button>
    <button id="mute" hidden></button>
  </section>
  <footer><a href="#" id="settings" data-i18n="popupSettings"></a></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
