<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../src/ui/common.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <div class="title" data-i18n="extName"></div>
  </header>
  <p class="muted" id="empty" data-i18n="popupStateUnconfigured" hidden></p>
  <ul id="portals"></ul>
  <template id="row">
    <li class="portal">
      <div class="line">
        <span class="dot"></span>
        <span class="host"></span>
        <span class="unread" hidden></span>
        <button class="open"></button>
      </div>
      <div class="muted small state"></div>
    </li>
  </template>
  <section class="actions">
    <button class="primary" id="setup" data-i18n="popupSetup" hidden></button>
    <button id="mute" hidden></button>
    <div class="muted small" id="muted" hidden></div>
  </section>
  <footer><a href="#" id="settings" data-i18n="popupSettings"></a></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
